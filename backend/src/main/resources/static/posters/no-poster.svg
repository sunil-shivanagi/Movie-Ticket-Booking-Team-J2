<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title desc">
  <title id="title">Poster Not Available</title>
  <desc id="desc">Fallback movie poster image</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="22" y="22" width="256" height="406" fill="none" stroke="#e94560" stroke-width="3" rx="10"/>
  <text x="50%" y="45%" fill="#ffffff" font-size="22" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Movie Poster</text>
  <text x="50%" y="53%" fill="#e94560" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Not Available</text>
  <text x="50%" y="88%" fill="#9ca3af" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">movie-ticket-booking</text>
</svg>
